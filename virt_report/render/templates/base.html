<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}Libvirt / QEMU / KVM 社区动态追踪{% endblock %}">
  <link rel="alternate" type="application/rss+xml" title="virt-report RSS" href="{{ root }}feed.xml">
  <link rel="shortcut icon" href="{{ root }}favicon.ico?v={{ asset_version }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ root }}favicon-32.png?v={{ asset_version }}">
  <link rel="stylesheet" href="{{ root }}assets/site.css?v={{ asset_version }}">
  {% block head_extra %}{% endblock %}
</head>
<body id="top">
  <a class="skip" href="#main">跳到主要内容</a>
  <header class="site-head"><div class="wrap head-row">
    <div class="brand-lockup"><a class="brand" href="{{ root }}index.html"><img class="brand-mark" src="{{ root }}assets/brand-mark.png?v={{ asset_version }}" alt="" width="31" height="31"><span>virt-report</span></a><span class="brand-sub">虚拟化社区动态</span></div>
    <div class="head-actions">
      <nav class="main-nav" aria-label="主导航">
        <a href="{{ root }}index.html" class="{% block nav_home %}on{% endblock %}">首页</a><a href="{{ root }}daily/index.html">日报</a><a href="{{ root }}weekly/index.html">周报</a><a href="{{ root }}monthly/index.html">月报</a><a href="{{ root }}topics.html" class="{% block nav_topics %}{% endblock %}">专题</a><a href="{{ root }}conferences.html" class="{% block nav_conferences %}{% endblock %}">会议</a><a href="{{ root }}about.html" class="{% block nav_about %}{% endblock %}">关于</a>
      </nav>
    </div>
  </div></header>
  <main id="main"><div class="wrap">{% block content %}{% endblock %}</div></main>
  <footer class="site-foot"><div class="wrap foot-row"><span>© 2026 <strong>virt-report</strong> · 虚拟化社区动态。数据来自社区，分析仅供参考。<a href="{{ root }}metrics.html">运行状态</a></span></div></footer>
  <script src="{{ root }}assets/site.js?v={{ asset_version }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
