<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}Libvirt / QEMU / KVM 社区动态追踪{% endblock %}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230f766e'/><text x='32' y='45' text-anchor='middle' fill='white' font-size='38' font-weight='800' font-family='Arial,sans-serif'>V</text></svg>">
  <script>try{const t=localStorage.getItem('vr-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <style>
    :root {
      --bg:#f4f3ef; --paper:#fffefa; --surface:#fff; --surface-2:#f8f7f3;
      --ink:#172026; --ink-2:#3c484f; --muted:#68757c; --faint:#929da2;
      --line:#dedfd9; --line-soft:#eaeae5; --brand:#0f766e; --brand-2:#115e59;
      --brand-soft:#dff2ef; --orange:#c65d28; --orange-soft:#fae8de;
      --shadow:0 1px 2px rgba(20,32,38,.05),0 12px 36px rgba(20,32,38,.06);
      --serif:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,serif;
      --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      --mono:ui-monospace,"SFMono-Regular",Consolas,monospace;
    }
    [data-theme="dark"] { --bg:#111719; --paper:#171e20; --surface:#1b2326; --surface-2:#20292c; --ink:#edf1ee; --ink-2:#c6ceca; --muted:#96a29e; --faint:#707c79; --line:#303a3c; --line-soft:#273033; --brand:#5cc5b8; --brand-2:#7bd4c9; --brand-soft:#1d3a37; --orange:#f09968; --orange-soft:#422b22; --shadow:0 10px 36px rgba(0,0,0,.24); }
    @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111719;--paper:#171e20;--surface:#1b2326;--surface-2:#20292c;--ink:#edf1ee;--ink-2:#c6ceca;--muted:#96a29e;--faint:#707c79;--line:#303a3c;--line-soft:#273033;--brand:#5cc5b8;--brand-2:#7bd4c9;--brand-soft:#1d3a37;--orange:#f09968;--orange-soft:#422b22;--shadow:0 10px 36px rgba(0,0,0,.24)}}
    *{box-sizing:border-box} html{scroll-behavior:smooth;-webkit-text-size-adjust:100%} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--sans);-webkit-font-smoothing:antialiased} a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline;text-underline-offset:3px} button,input{font:inherit} :focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 45%,transparent);outline-offset:3px;border-radius:5px}
    .skip{position:fixed;left:12px;top:-60px;z-index:100;background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:7px}.skip:focus{top:12px}
    .wrap{width:min(1180px,calc(100% - 40px));margin-inline:auto}.site-head{position:sticky;top:0;z-index:30;border-bottom:1px solid color-mix(in srgb,var(--line) 80%,transparent);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px) saturate(160%)}.head-row{height:58px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:800;letter-spacing:-.025em;font-size:18px}.brand:hover{text-decoration:none}.brand-mark{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;font:800 15px var(--sans)}.brand-sub{font-size:11px;color:var(--muted);font-weight:550;letter-spacing:.02em}.head-actions,.main-nav{display:flex;align-items:center;gap:5px}.main-nav a{color:var(--muted);font-size:13px;padding:7px 10px;border-radius:7px}.main-nav a:hover,.main-nav a.on{color:var(--brand);background:var(--brand-soft);text-decoration:none}.icon-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--muted);cursor:pointer}.icon-btn:hover{color:var(--brand);border-color:var(--brand)}
    main{min-height:calc(100vh - 150px);padding:34px 0 72px}.site-foot{border-top:1px solid var(--line);padding:24px 0 36px;color:var(--muted);font-size:12px}.foot-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.foot-row strong{color:var(--ink-2)} code{font:13px var(--mono);background:var(--surface-2);padding:2px 6px;border-radius:5px}
    .period-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:0 auto 18px;max-width:1020px;color:var(--faint);font-size:12px}.period-nav a{color:var(--muted)}.period-nav a:last-child{text-align:right}.period-nav .dim:last-child{text-align:right}
    .report-layout{display:grid;grid-template-columns:minmax(0,1fr) 205px;gap:32px;align-items:start;max-width:1020px;margin:auto}.post{min-width:0}.report-hero{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:30px 32px 26px;box-shadow:var(--shadow)}.report-hero:before{content:"";position:absolute;left:0;top:0;width:100%;height:4px;background:linear-gradient(90deg,var(--brand),#4aa99f 62%,var(--orange))}.kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);font-weight:800}.title{font:800 clamp(28px,4.5vw,42px)/1.18 var(--serif);letter-spacing:-.025em;margin:9px 0 10px}.meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px 13px;color:var(--muted);font-size:12px}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;background:var(--brand-soft);color:var(--brand-2);font-weight:700}.badge.warn{background:var(--orange-soft);color:var(--orange)}.trust-note{display:flex;gap:9px;margin-top:19px;padding-top:15px;border-top:1px solid var(--line-soft);color:var(--muted);font-size:12px;line-height:1.55}.trust-note svg{flex:0 0 auto;margin-top:2px;color:var(--brand)}
    .report-section{scroll-margin-top:78px;margin-top:34px}.sec-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 13px;font:750 20px/1.3 var(--serif);letter-spacing:-.01em}.sec-title>span:first-child{display:flex;align-items:center;gap:9px}.sec-title>span:first-child:before{content:"";width:4px;height:19px;border-radius:3px;background:var(--brand)}.count{font:700 11px var(--mono);color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:3px 7px;border-radius:999px}
    .overview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.overview-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px}.overview-card h3{font:750 15px var(--serif);margin:0 0 5px;color:var(--brand-2)}.overview-card p{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.65}
    .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 10px}.stat .n{display:block;font:750 20px/1.2 var(--mono);letter-spacing:-.04em}.stat .l{display:block;margin-top:4px;color:var(--muted);font-size:10.5px}.dist{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 15px}.dist-row{display:grid;grid-template-columns:100px 1fr 40px;align-items:center;gap:10px;margin:7px 0;font-size:12px}.dist-row .name{color:var(--ink-2)}.dist-row .bar{height:6px;border-radius:9px;background:var(--line-soft);overflow:hidden}.dist-row .bar span{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--brand),#62b9af)}.dist-row .cnt{text-align:right;color:var(--muted);font:11px var(--mono)}
    .project-tools{display:flex;gap:6px;flex-wrap:wrap;margin:28px 0 0}.filter-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer}.filter-btn:hover,.filter-btn.active{color:var(--brand-2);border-color:var(--brand);background:var(--brand-soft)}
    .dynamics{display:grid;gap:9px}.dyn{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 13px;transition:transform .15s,border-color .15s,box-shadow .15s}.dyn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--brand) 45%,var(--line));box-shadow:var(--shadow)}.d-title{font:700 16px/1.42 var(--serif);padding-right:28px}.d-title a{color:var(--ink)}.d-title a:hover{color:var(--brand)}.external{position:absolute;right:15px;top:15px;color:var(--faint);font-size:14px}.d-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:6px 0;color:var(--muted);font-size:11.5px}.tag{padding:2px 7px;border:1px solid var(--line);background:var(--surface-2);border-radius:5px;color:var(--brand-2);font:650 10.5px var(--mono)}.d-sum{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.65}.sources{margin-top:25px;padding:13px 15px;border-radius:10px;background:var(--surface-2);color:var(--muted);font-size:11.5px}.empty{text-align:center;padding:52px 20px}.empty h2{font:750 23px var(--serif);margin:0 0 8px}.empty p{color:var(--muted)}
    .toc{position:sticky;top:78px;border-left:1px solid var(--line);padding-left:14px;font-size:12px}.toc-title{font-weight:800;color:var(--faint);letter-spacing:.09em;text-transform:uppercase;margin:0 0 7px}.toc a{display:flex;justify-content:space-between;color:var(--muted);padding:6px 8px;border-radius:6px}.toc a:hover,.toc a.active{color:var(--brand-2);background:var(--brand-soft);text-decoration:none}.toc .count{border:0;padding:0;background:none}.back-top{display:block;margin-top:13px;border-top:1px solid var(--line-soft);padding-top:10px!important}
    .home-hero{display:block;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:30px 32px;box-shadow:var(--shadow)}.home-hero h1{font:800 clamp(25px,3vw,34px)/1.2 var(--serif);letter-spacing:-.02em;margin:0 0 9px;white-space:nowrap}.home-hero p{max-width:none;color:var(--ink-2);margin:0;white-space:nowrap}
    .health-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.health{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}.health-dot{width:7px;height:7px;border-radius:50%;background:#28a572;box-shadow:0 0 0 3px color-mix(in srgb,#28a572 15%,transparent)}.health.warn .health-dot{background:var(--orange)}.health strong{display:block;font-size:11px;line-height:1.2}.health span{display:block;color:var(--muted);font-size:9.5px;margin-top:2px}
    .home-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:30px;align-items:start;margin-top:28px}.home-toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:10px}.home-toolbar h2{font:750 21px var(--serif);margin:0}.search{position:relative;width:min(260px,48%)}.search input{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);padding:0 11px 0 32px;font-size:12px}.search:before{content:"⌕";position:absolute;left:11px;top:5px;color:var(--muted);font-size:17px}.report-group{margin-top:26px;scroll-margin-top:74px}.group-head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}.group-head h3{font:750 17px var(--serif);margin:0}.group-head span{color:var(--muted);font:11px var(--mono)}.report-list{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.report-card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;color:var(--ink);min-height:102px}.report-card:hover{border-color:var(--brand);box-shadow:var(--shadow);text-decoration:none}.report-card .type{color:var(--brand);font-size:10px;font-weight:800;letter-spacing:.08em}.report-card .r-title{font:750 16px var(--serif);margin:5px 0}.report-card .r-meta{font-size:10.5px;color:var(--muted)}.report-card .r-model{display:inline-block;margin-top:8px;font:10px var(--mono);color:var(--faint)}
    .cal{position:sticky;top:76px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow)}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.cal-head .m{font:750 15px var(--serif)}.cal-nav{padding:2px 8px;border-radius:6px;color:var(--muted)}.cal-nav:hover{background:var(--brand-soft);text-decoration:none}.cal-nav.dim{color:var(--faint);pointer-events:none}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cal-dow{text-align:center;color:var(--faint);font-size:10px;padding-bottom:4px}.cal-day{aspect-ratio:1;display:grid;place-items:center;color:var(--faint);font-size:11.5px;border-radius:6px}.cal-day.in{color:var(--ink-2)}.cal-day.has a{display:grid;place-items:center;width:100%;height:100%;border-radius:6px;background:var(--brand-soft);color:var(--brand-2);font-weight:800}.cal-day.has a:hover{background:var(--brand);color:#fff;text-decoration:none}.cal-legend{display:flex;align-items:center;gap:6px;margin-top:9px;color:var(--faint);font-size:10px}.cal-legend i{width:8px;height:8px;border-radius:2px;background:var(--brand-soft);border:1px solid var(--brand)}
    .brand-sub{font-size:13px;letter-spacing:.01em}
    @media(max-width:860px){.brand-sub{display:none}.report-layout{grid-template-columns:1fr}.toc{position:sticky;top:58px;z-index:15;display:flex;gap:3px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:5px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px)}.toc-title,.toc .back-top{display:none}.toc a{white-space:nowrap}.overview-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.home-grid{grid-template-columns:1fr}.cal{position:static}.health-strip{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:620px){.wrap{width:min(100% - 24px,1180px)}.head-row{height:auto;min-height:55px;flex-wrap:wrap;padding:9px 0}.main-nav{order:3;width:100%;overflow:auto;border-top:1px solid var(--line-soft);padding-top:6px}.main-nav a{white-space:nowrap}.report-hero,.home-hero{padding:22px 19px;border-radius:14px}.home-hero{grid-template-columns:1fr}.hero-actions{justify-content:flex-start}.title{font-size:29px}.period-nav{margin-bottom:12px}.stats{grid-template-columns:repeat(2,1fr)}.report-list{grid-template-columns:1fr}.health-strip{grid-template-columns:repeat(2,1fr)}.home-toolbar{align-items:flex-start;flex-direction:column}.search{width:100%}.dist-row{grid-template-columns:80px 1fr 32px}.dyn{padding:13px 14px}.overview-card{padding:13px 14px}}
    @media(max-width:860px) and (min-width:621px){.brand-sub{display:inline}}
    @media(max-width:860px){.home-hero h1,.home-hero p{white-space:normal}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
  </style>
</head>
<body id="top">
  <a class="skip" href="#main">跳到主要内容</a>
  <header class="site-head"><div class="wrap head-row">
    <a class="brand" href="{{ root }}index.html"><span class="brand-mark">V</span><span>virt-report</span><span class="brand-sub">虚拟化社区动态</span></a>
    <div class="head-actions">
      <nav class="main-nav" aria-label="主导航">
        <a href="{{ root }}index.html" class="{% block nav_home %}on{% endblock %}">总览</a><a href="{{ root }}index.html#daily">日报</a><a href="{{ root }}index.html#weekly">周报</a><a href="{{ root }}index.html#monthly">月报</a>
      </nav>
      <button class="icon-btn" id="theme-toggle" title="切换明暗主题" aria-label="切换明暗主题">◐</button>
    </div>
  </div></header>
  <main id="main"><div class="wrap">{% block content %}{% endblock %}</div></main>
  <footer class="site-foot"><div class="wrap foot-row"><span>© 2026 <strong>virt-report</strong> · 虚拟化社区动态</span><span>数据来自社区，分析仅供参考</span></div></footer>
  <script>
    (()=>{const b=document.getElementById('theme-toggle');b?.addEventListener('click',()=>{const d=document.documentElement;const dark=d.dataset.theme==='dark'||(!d.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);d.dataset.theme=dark?'light':'dark';try{localStorage.setItem('vr-theme',d.dataset.theme)}catch(e){}})})();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
