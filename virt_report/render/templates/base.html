<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}Libvirt / QEMU / KVM 社区动态追踪{% endblock %}">
  <link rel="alternate" type="application/rss+xml" title="virt-report RSS" href="{{ root }}feed.xml">
  <link rel="shortcut icon" href="{{ root }}favicon.ico?v={{ asset_version }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ root }}favicon-32.png?v={{ asset_version }}">
  <link rel="stylesheet" href="{{ root }}assets/site.css?v={{ asset_version }}">
  {% block head_extra %}{% endblock %}
</head>
<body id="top">
  <a class="skip" href="#main">跳到主要内容</a>
  <header class="site-head"><div class="wrap head-row">
    <div class="brand-lockup"><a class="brand" href="{{ root }}index.html"><img class="brand-mark" src="{{ root }}assets/brand-mark.png?v={{ asset_version }}" alt="" width="31" height="31"><span>virt-report</span></a><span class="brand-sub">虚拟化社区动态</span></div>
    <div class="mobile-head-tools">
      <a href="{{ root }}search.html" class="mobile-search-icon {% block nav_search_mobile %}{% endblock %}" aria-label="搜索" title="搜索"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></a>
      <button type="button" class="site-menu-toggle" data-site-menu-toggle aria-label="展开主菜单" aria-expanded="false" aria-controls="site-navigation" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true"><path class="menu-bars" d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="menu-close" d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>
    <div class="head-actions" id="site-navigation">
      <nav class="main-nav" aria-label="主导航">
        <a href="{{ root }}index.html" class="{% block nav_home %}on{% endblock %}"{% if self.nav_home()|trim %} aria-current="page"{% endif %}>首页</a>
        <details class="nav-reports" data-report-menu>
          <summary class="{% block nav_reports %}{% endblock %}">报告<svg viewBox="0 0 12 8" width="10" height="7" fill="none" aria-hidden="true"><path d="m1 1.5 5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
          <div class="report-subnav">
            <a href="{{ root }}daily/index.html" class="{% block nav_daily %}{% endblock %}"{% if self.nav_daily()|trim %} aria-current="page"{% endif %}>日报</a>
            <a href="{{ root }}weekly/index.html" class="{% block nav_weekly %}{% endblock %}"{% if self.nav_weekly()|trim %} aria-current="page"{% endif %}>周报</a>
            <a href="{{ root }}monthly/index.html" class="{% block nav_monthly %}{% endblock %}"{% if self.nav_monthly()|trim %} aria-current="page"{% endif %}>月报</a>
          </div>
        </details>
        <a href="{{ root }}topics.html" class="{% block nav_topics %}{% endblock %}"{% if self.nav_topics()|trim %} aria-current="page"{% endif %}>专题</a>
        <a href="{{ root }}conferences.html" class="{% block nav_conferences %}{% endblock %}"{% if self.nav_conferences()|trim %} aria-current="page"{% endif %}>会议</a>
        <a href="{{ root }}versions.html" class="{% block nav_versions %}{% endblock %}"{% if self.nav_versions()|trim %} aria-current="page"{% endif %}>版本</a>
        <a href="{{ root }}mechanisms.html" class="{% block nav_mechanisms %}{% endblock %}"{% if self.nav_mechanisms()|trim %} aria-current="page"{% endif %}>原理</a>
        <a href="{{ root }}about.html" class="{% block nav_about %}{% endblock %}"{% if self.nav_about()|trim %} aria-current="page"{% endif %}>关于</a>
        <a href="{{ root }}search.html" class="nav-search-icon {% block nav_search %}{% endblock %}" aria-label="搜索" title="搜索"{% if self.nav_search()|trim %} aria-current="page"{% endif %}><svg viewBox="0 0 24 24" width="17" height="17" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></a>
      </nav>
    </div>
  </div></header>
  <main id="main"><div class="wrap">{% block content %}{% endblock %}</div></main>
  <footer class="site-foot"><div class="wrap foot-row"><span>© 2026 <a href="https://github.com/taifuer/virt_report" target="_blank" rel="noopener noreferrer"><strong>virt-report</strong></a> - 虚拟化社区动态。数据来自社区，分析仅供参考。<a href="{{ root }}metrics.html">运行状态</a></span></div></footer>
  <button class="back-to-top" type="button" data-back-to-top aria-label="返回顶部" title="返回顶部"><span aria-hidden="true"><svg viewBox="0 0 20 20" width="18" height="18" fill="none"><path d="M4.75 9 10 3.75 15.25 9M10 4v12.25" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
  <script src="{{ root }}assets/site.js?v={{ asset_version }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
