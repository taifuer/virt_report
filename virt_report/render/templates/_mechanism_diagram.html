{% macro diagram(name, title, description) -%}
{% set item = mechanism_diagrams[name] %}
<figure class="mechanism-diagram" data-diagram="{{ name }}" data-mechanism-view="diagram">
  <div class="mechanism-view-heading">
    <span data-mechanism-title>{{ title }}</span>
    <button type="button" data-mechanism-expand aria-label="放大查看{{ title }}" hidden>放大查看</button>
  </div>
  <div class="mechanism-diagram-scroll" role="region" aria-label="{{ title }}">
    <img src="{{ root }}assets/{{ name }}.svg?v={{ mechanism_asset_version }}" alt="{{ description }}" loading="lazy">
  </div>
  <figcaption>{{ description }} <a href="{{ root }}assets/{{ name }}.svg?v={{ mechanism_asset_version }}" target="_blank" rel="noopener">打开原图</a></figcaption>
  <details class="mechanism-diagram-source"><summary>Mermaid 源码</summary><pre><code>{{ item.source }}</code></pre></details>
</figure>
{%- endmacro %}
