:#73948b;stroke-width:1px;}#my-svg .rough-node .label text,#my-svg .node .label text,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-anchor:middle;}#my-svg .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#my-svg .rough-node .label,#my-svg .node .label,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-align:center;}#my-svg .node.clickable{cursor:pointer;}#my-svg .root .anchor path{fill:#738b87!important;stroke-width:0;stroke:#738b87;}#my-svg .arrowheadPath{fill:#0b0b0b;}#my-svg .edgePaths .path{stroke:#738b87;stroke-width:1px;}#my-svg .flowchart-link{stroke:#738b87;fill:none;}#my-svg .edgeLabel{background-color:#f3f5f2;text-align:center;}#my-svg .edgeLabel p{background-color:#f3f5f2;}#my-svg .edgeLabel rect{opacity:0.5;background-color:#f3f5f2;fill:#f3f5f2;}#my-svg .labelBkg{background-color:rgba(243, 245, 242, 0.5);}#my-svg .cluster rect{fill:#f5f4f1;stroke:hsl(45, 0%, 85.2941176471%);stroke-width:1px;}#my-svg .cluster text{fill:#0a0b0e;}#my-svg .cluster span{color:#0a0b0e;}#my-svg .node .collapsed-indicator{fill:hsl(45, 0%, 85.2941176471%);stroke:none;opacity:0.6;}#my-svg .node .collapsed-separator{stroke:hsl(45, 0%, 85.2941176471%);stroke-width:0.75px;}#my-svg div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:12px;background:#f5f4f1;border:1px solid hsl(45, 0%, 85.2941176471%);border-radius:2px;pointer-events:none;z-index:100;}#my-svg .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#263c38;}#my-svg rect.text{fill:none;stroke-width:0;}#my-svg .icon-shape,#my-svg .image-shape{background-color:#f3f5f2;text-align:center;}#my-svg .icon-shape p,#my-svg .image-shape p{background-color:#f3f5f2;padding:2px;}#my-svg .icon-shape .label rect,#my-svg .image-shape .label rect{opacity:0.5;background-color:#f3f5f2;fill:#f3f5f2;}#my-svg .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#my-svg .node .label