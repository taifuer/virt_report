# virt-report 配置
# 数据源均已验证可用 (2026-07)

project:
  name: virt-report
  # 报告日期切窗所用时区；存储统一用 UTC
  timezone: Asia/Shanghai

# 数据源
sources:
  mailing_lists:
    # GNU pipermail 整月 mbox: 完整历史 + 邮件头 (Message-ID/In-Reply-To), 无反爬
    - name: qemu-devel
      type: mbox
      url: https://lists.gnu.org/archive/mbox/qemu-devel/
    # KVM 当前 public-inbox Git epoch：支持按时间浅克隆/增量 fetch，不受 Atom 25 条限制
    - name: kvm
      type: lore_git
      url: https://lore.kernel.org/kvm/git/1.git
    # libvirt-devel 官方 HyperKitty：按月归档页发现线程，REST API 拉完整邮件头/正文
    - name: libvir-list
      type: hyperkitty
      url: https://lists.libvirt.org/archives/list/devel@lists.libvirt.org/
  gitlab:
    - name: libvirt
      project: libvirt/libvirt
      url: https://gitlab.com
    - name: qemu
      project: qemu-project/qemu
      url: https://gitlab.com

storage:
  db_path: data/virt_report.db

# LLM 总结 (DeepSeek, OpenAI 兼容端点; 切 GLM 只需改 base_url/api_key_env/model)
llm:
  provider: deepseek
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  # 2026-08-01 起，新生成的日/周/月报统一使用 V4 Flash 正式版
  daily_model: deepseek-v4-flash
  weekly_model: deepseek-v4-flash
  monthly_model: deepseek-v4-flash
  # 单次喂给模型的线程数上限 (DeepSeek V4 上下文 1M；仍需控制噪声与成本)
  daily_top_n: 50
  # 人民币/百万 tokens；仅用于运行页估算，价格变化时按官方价格页调整
  # https://api-docs.deepseek.com/zh-cn/quick_start/pricing
  pricing_cny:
    deepseek-v4-flash: {cache_hit: 0.02, cache_miss: 1.0, output: 2.0}
    # 保留历史模型单价，用于估算切换前报告的调用成本
    deepseek-v4-pro: {cache_hit: 0.025, cache_miss: 3.0, output: 6.0}

render:
  output_dir: site
  site_url: https://virt.taifua.com

schedule:
  fetch_cron: "7 */4 * * *"       # 每 4 小时增量采集
  daily_cron: "15 0 * * *"        # 00:15 生成前一日日报
  weekly_cron: "25 0 * * 1"       # 周一 00:25 生成上一周周报
  monthly_cron: "35 0 1 * *"      # 每月 1 日 00:35 生成上月月报
  backup_cron: "5 1 * * *"        # 每天 01:05 创建一致性数据库快照
  backup_keep_days: 14             # 自动备份保留天数
  job_timeout_seconds: 3600        # 单个调度任务最长运行一小时
  retry_limit: 3                   # 失败或降级报告最多尝试次数
  retry_delay_seconds: 900         # 重试间隔 15 分钟
  auto_export: false               # 动态服务无需全量导出；纯静态部署可改 true

metrics_access:
  access_key_env: METRICS_ACCESS_KEY
  session_ttl_hours: 12
