services:
  web:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-mirrors.aliyun.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    command: ["virt-report", "--config", "/app/config.yaml", "serve", "--host", "0.0.0.0", "--port", "8090"]
    env_file: .env
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./data:/app/data
      - ./site:/app/site
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-mirrors.aliyun.com}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    command: ["virt-report", "--config", "/app/config.yaml", "scheduler"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./site:/app/site
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
