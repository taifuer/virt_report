services:
  web:
    build: .
    command: ["virt-report", "--config", "/app/config.yaml", "serve", "--host", "0.0.0.0", "--port", "8090"]
    env_file: .env
    ports:
      - "8090:8090"
    volumes:
      - ./data:/app/data
      - ./site:/app/site
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    build: .
    command: ["virt-report", "--config", "/app/config.yaml", "scheduler"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./site:/app/site
    restart: unless-stopped
