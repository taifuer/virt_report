name: Data or report correction
description: Report missing data, attribution, classification, summary, or link problems.
title: "[Data] "
body:
  - type: input
    id: page
    attributes:
      label: Affected page
      description: Provide the full public report or source URL.
      placeholder: https://virt.taifua.com/...
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Problem type
      options:
        - Missing or incomplete data
        - Incorrect attribution or source
        - Misclassification
        - Misleading summary or commentary
        - Broken or stale link
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Identify the affected item and explain the correction needed.
    validations:
      required: true
  - type: input
    id: upstream
    attributes:
      label: Canonical upstream reference
      placeholder: Public mailing-list, issue, project, or conference URL
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I did not include credentials, private correspondence, or unnecessary personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true
