name: Bug report
description: Report a reproducible application, rendering, or deployment defect.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve virt-report. Do not include credentials or private runtime data.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and which page or command is affected?
      placeholder: Include a public URL or command when available.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Commit SHA, container tag, or deployment date
  - type: textarea
    id: environment
    attributes:
      label: Environment and sanitized logs
      description: Include Python/browser/OS details and remove all tokens, headers, and private data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This is not a security vulnerability.
          required: true
