name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e . pytest pyflakes
      - run: python -m pyflakes virt_report tests
      - run: python -m pytest tests/ -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build container with globally reachable mirrors
        run: |
          docker build \
            --build-arg PYTHON_IMAGE=python:3.12-slim \
            --build-arg DEBIAN_MIRROR=deb.debian.org \
            --build-arg PIP_INDEX_URL=https://pypi.org/simple \
            -t virt-report:test .

  models:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # Pure Node tests need neither npm dependencies nor a browser.
      - run: npm run test:models
