name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e . pytest pyflakes
      - run: python -m pyflakes virt_report tests
      - run: python -m pytest tests/ -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build container with globally reachable mirrors
        run: |
          docker build \
            --build-arg PYTHON_IMAGE=python:3.12-slim \
            --build-arg DEBIAN_MIRROR=deb.debian.org \
            --build-arg PIP_INDEX_URL=https://pypi.org/simple \
            -t virt-report:test .

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BROWSER_ARTIFACT_DIR: artifacts/browser
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:models
      - run: npm run test:browser
      - name: Preserve browser screenshots and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: artifacts/browser
          retention-days: 7
          if-no-files-found: ignore
