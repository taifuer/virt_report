[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virt-report"
version = "0.1.0"
description = "Track libvirt/QEMU/KVM mailing lists and GitLab issues; produce daily/weekly/monthly Chinese newspaper-style reports."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "taifu", email = "taifu@taifua.com"},
]
requires-python = ">=3.11"
keywords = ["virtualization", "qemu", "kvm", "libvirt", "community-report"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "feedparser>=6.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "requests>=2.31",
]

[project.scripts]
virt-report = "virt_report.cli:main"

[project.urls]
Homepage = "https://virt.taifua.com/"
Repository = "https://github.com/taifuer/virt_report"
Issues = "https://github.com/taifuer/virt_report/issues"

[tool.setuptools.packages.find]
include = ["virt_report*"]

[tool.setuptools.package-data]
virt_report = [
    "render/templates/*.html",
    "render/assets/*.css",
    "render/assets/*.js",
    "render/assets/*.png",
    "render/assets/*.ico",
    "content/*.json",
]
