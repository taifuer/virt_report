[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virt-report"
version = "0.1.0"
description = "Track libvirt/QEMU/KVM mailing lists and GitLab issues; produce daily/weekly/monthly Chinese newspaper-style reports."
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "requests>=2.31",
]

[project.scripts]
virt-report = "virt_report.cli:main"

[tool.setuptools.packages.find]
include = ["virt_report*"]

[tool.setuptools.package-data]
virt_report = [
    "render/templates/*.html",
    "render/assets/*.css",
    "render/assets/*.js",
    "render/assets/*.png",
    "render/assets/*.ico",
    "content/*.json",
]
