<svg xmlns="http://www.w3.org/2000/svg" id="my-svg" width="777.032" class="flowchart" style="max-width: 777.032px; background-color: transparent;" viewBox="0 0 777.03173828125 79.5" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg" height="79.5"><title id="chart-title-my-svg">Linux 从早期 PC 到通用内核的发布节点</title><desc id="chart-desc-my-svg">1991 年 0.01 面向 i386 PC 实验，1994 年 1.0 完善可用系统，1996 年 2.0 支持 SMP，2003 年开始的 2.6 系列持续发展多核扩展和响应能力。节点是版本里程碑，并非每项能力的首次出现日期。</desc><style>#my-svg{font-family:Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:15px;fill:#263c38;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#f5f4f1;}#my-svg .error-text{fill:#0a0b0e;stroke:#0a0b0e;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#738b87;stroke:#738b87;}#my-svg .marker.cross{stroke:#738b87;}#my-svg svg{font-family:Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:15px;}#my-svg p{margin:0;}#my-svg .label{font-family:Noto Sans CJK SC,Microsoft YaHei,sans-serif;color:#263c38;}#my-svg .cluster-label text{fill:#0a0b0e;}#my-svg .cluster-label span{color:#0a0b0e;}#my-svg .cluster-label span p{background-color:transparent;}#my-svg .label text,#my-svg span{fill:#263c38;color:#263c38;}#my-svg .node rect,#my-svg .node circle,#my-svg .node ellipse,#my-svg .node polygon,#my-svg .node path