<svg xmlns="http://www.w3.org/2000/svg" id="my-svg" width="308.359" class="flowchart" style="max-width: 308.359px; background-color: transparent;" viewBox="0 0 308.359375 560" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg" height="560"><title id="chart-title-my-svg">cpr-luo 的宿主内核切换与 Guest 暂停窗口</title><desc id="chart-desc-my-svg">旧端停止 Guest 并保存执行状态，通过 LUO 登记受支持的 RAM 与 CPR 资源。kexec 切换期间 KHO 保留内存。新内核和新 QEMU 恢复资源与状态后继续执行同一个 Guest。中间是暂停窗口，不是重新引导 Guest，也不是 Caretaker 持续运行路径。</desc><style>#my-svg{font-family:Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:15px;fill:#263c38;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#f5f4f1;}#my-svg .error-text{fill:#0a0b0e;stroke:#0a0b0e;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#738b87;stroke:#738b87;}#my-svg .marker.cross{stroke:#738b87;}#my-svg svg{font-family:Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:15px;}#my-svg p{margin:0;}#my-svg .label{font-family:Noto Sans CJK SC,Microsoft YaHei,sans-serif;color:#263c38;}#my-svg .cluster-label text{fill:#0a0b0e;}#my-svg .cluster-label span{color:#0a0b0e;}#my-svg .cluster-label span p{background-color:transparent;}#my-svg .label text,#my-svg span{fill:#263c38;color:#263c38;}#my-svg .node rect,#my-svg .node circle,#my-svg .node ellipse,#my-svg .node pol