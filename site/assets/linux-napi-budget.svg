<svg xmlns="http://www.w3.org/2000/svg" id="my-svg" width="239.531" class="flowchart" style="max-width: 239.531px; background-color: transparent;" viewBox="0 0 239.53125 607" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-my-svg" aria-labelledby="chart-title-my-svg" height="607"><title id="chart-title-my-svg">NAPI 接收预算为 64 时处理 100 个包</title><desc id="chart-desc-my-svg">示例固定已有 100 个接收包且没有新包到达。首次通知调度轮询，第一轮处理 64 个并保持调度，第二轮处理剩余 36 个；成功完成 NAPI 后按设备协议恢复通知，不需要为第二轮再发一个中断。</desc><style>#my-svg{font-family:Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:15px;fill:#263c38;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#f5f4f1;}#my-svg .error-text{fill:#0a0b0e;stroke:#0a0b0e;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#738b87;stroke:#738b87;}#my-svg .marker.cross{stroke:#738b87;}#my-svg svg{font-family:Noto Sans CJK SC,Microsoft YaHei,sans-serif;font-size:15px;}#my-svg p{margin:0;}#my-svg .label{font-family:Noto Sans CJK SC,Microsoft YaHei,sans-serif;color:#263c38;}#my-svg .cluster-label text{fill:#0a0b0e;}#my-svg .cluster-label span{color:#0a0b0e;}#my-svg .cluster-label span p{background-color:transparent;}#my-svg .label text,#my-svg span{fill:#263c38;color:#263c38;}#my-svg .node rect,#my-svg .node circle,#my-svg .node ellipse,#my-svg .node polygon,#my-svg .node path{fill:#e4f1ec;stroke:#7394