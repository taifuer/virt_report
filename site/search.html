<script>
const searchForm=document.querySelector('[data-search-form]'),searchQuery=document.querySelector('#search-query'),searchClear=document.querySelector('[data-search-clear]');
if(searchForm&&searchQuery&&searchClear){
  const hadQuery=searchQuery.value.trim().length>0;
  searchForm.querySelectorAll('select').forEach(select=>select.addEventListener('change',()=>{if(searchQuery.value.trim().length>=2)searchForm.requestSubmit()}));
  searchQuery.addEventListener('input',()=>{searchClear.hidden=!searchQuery.value;if(hadQuery&&!searchQuery.value)window.location.assign(searchForm.action)});
  searchClear.addEventListener('click',()=>{searchQuery.value='';searchClear.hidden=true;if(hadQuery)window.location.assign(searchForm.action);else searchQuery.focus()});
}
</script></body>
